name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Publish a non-production pre-release or a stable release"
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable
      version:
        description: "X.Y.Z or X.Y.Z-preview.N; leave blank to select the next version"
        required: false
        type: string
      publish:
        description: "Sign and publish a GitHub Release (requires the release environment)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fpink-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Release runs must target main."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          # The release must be declared in version.properties by a merged release-bump PR
          # (scripts/release_version.py --prepare): F-Droid's checkupdates reads it at the tag.
          python3 scripts/release_version.py \
            --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA" \
            --requested-version "$REQUESTED_VERSION" --release-type "$RELEASE_TYPE" \
            --version-properties version.properties --output release-metadata.json

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Free disk space for the buildserver image and Paddle build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      # Built exactly like F-Droid's buildserver, so F-Droid can reproduce this APK and
      # publish it with our signature (fdroiddata Binaries + AllowedAPKSigningKeys).
      - name: Build the reproducible release like F-Droid
        run: |
          bash scripts/fdroid-rb-docker.sh rb-output \
            --check-task :app:testFossDebugUnitTest --check-task :core:ai:test --check-task :core:model:test \
            --check-task :core:storage:test --check-task :recognition:paddle:test --check-task :recognition:kraken:test \
            --check-task :app:lintFossRelease --check-task :app:verifyFossReleaseRecognitionPackage \
            --check-task :app:verifyFossReleaseOfflineManifest
          cat rb-output/build-env.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'build-tools;36.0.0'

      - name: Verify release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 scripts/verify_release_apk.py \
            --apk rb-output/unsigned.apk \
            --version-name "$VERSION_NAME" --version-code "$VERSION_CODE" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --source-runtime-sums rb-output/paddle-runtime-SHA256SUMS
          mkdir release-staging
          cp rb-output/unsigned.apk release-staging/unsigned.apk
          cp rb-output/build-env.txt release-metadata.json LICENSE release-staging/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-staging/
          if-no-files-found: error
          retention-days: 7

      - name: Explain non-publishing run
        if: ${{ !inputs.publish }}
        run: |
          echo "Build-only run: the unsigned APK artifact is not installable. No signing key was used and no tag or release was created." >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.build.outputs.version_name }}
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
      TAG: ${{ needs.build.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Require publication approval
        env:
          PUBLICATION_APPROVED: ${{ vars.RELEASE_PUBLICATION_APPROVED }}
        run: |
          if [[ "$PUBLICATION_APPROVED" != true ]]; then
            echo "::error::Review licensing and configure RELEASE_PUBLICATION_APPROVED=true in the release environment."
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools build-tools;36.0.0'

      - name: Install apksigcopier
        run: sudo apt-get update && sudo apt-get install -y apksigcopier

      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPECTED_CERTIFICATE: ${{ vars.RELEASE_CERTIFICATE_SHA256 }}
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, json, os, pathlib, re, shutil, subprocess, tempfile

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def run(*args):
              return subprocess.check_output(args, text=True)

          version = os.environ["VERSION_NAME"]
          code = os.environ["VERSION_CODE"]
          tag = os.environ["TAG"]
          require(re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?", version), "Invalid version")
          suffix = version.partition("-")[2].split(".")
          require(not any(p.isdigit() and len(p) > 1 and p.startswith("0") for p in suffix), "Invalid prerelease identifier")
          require(os.environ["PRERELEASE"] in ("true", "false"), "Invalid release type")
          prerelease = os.environ["PRERELEASE"] == "true"
          require(prerelease == ("-" in version), "Release type must match version suffix")
          require(re.fullmatch(r"[1-9][0-9]*", code) and int(code) <= 2100000000, "Invalid version code")
          require(tag == "v" + version, "Invalid tag")
          metadata = json.loads(pathlib.Path("incoming/release-metadata.json").read_text())
          expected = {"schemaVersion": 1, "applicationId": "com.fpink.capture", "versionName": version,
                      "versionCode": int(code), "tag": tag, "sourceSha": os.environ["GITHUB_SHA"]}
          require(all(metadata.get(k) == v for k, v in expected.items()), "Release metadata mismatch")
          require(metadata.get("isPrerelease") is prerelease, "Release metadata type mismatch")
          for name in ("KEYSTORE_BASE64", "KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD", "EXPECTED_CERTIFICATE"):
              require(bool(os.environ.get(name)), "Missing signing configuration: " + name)
          certificate = os.environ["EXPECTED_CERTIFICATE"].replace(":", "").lower()
          require(re.fullmatch(r"[0-9a-f]{64}", certificate), "Invalid expected certificate fingerprint")
          previous = metadata["previousSigningCertificateSha256"]
          require(previous is None or previous == certificate, "Signing key differs from published releases; rotation is not supported")
          tools = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools/36.0.0"
          output = pathlib.Path("release-assets")
          output.mkdir()
          # fdroiddata's Binaries URL expects this asset name: releases/download/v%v/FPInk-%v.apk
          apk = output / ("FPInk-" + version + ".apk")
          with tempfile.TemporaryDirectory(prefix="fpink-signing-", dir=os.environ["RUNNER_TEMP"]) as temp:
              keystore = pathlib.Path(temp) / "release.keystore"
              keystore.write_bytes(base64.b64decode(os.environ["KEYSTORE_BASE64"], validate=True))
              keystore.chmod(0o600)
              # Sign the reproducible APK as is: F-Droid verifies that our APK is its own build
              # plus a signature (apksigcopier), so the ZIP must not be realigned or re-padded.
              subprocess.run([str(tools / "zipalign"), "-c", "-P", "16", "4", "incoming/unsigned.apk"], check=True)
              subprocess.run([str(tools / "apksigner"), "sign", "--alignment-preserved",
                              "--v1-signing-enabled", "false", "--v2-signing-enabled", "true",
                              "--v3-signing-enabled", "true", "--v4-signing-enabled", "false", "--ks", str(keystore),
                              "--ks-key-alias", os.environ["KEY_ALIAS"], "--ks-pass", "env:KEYSTORE_PASSWORD",
                              "--key-pass", "env:KEY_PASSWORD", "--out", str(apk), "incoming/unsigned.apk"], check=True)
          verification = run(str(tools / "apksigner"), "verify", "--verbose", "--print-certs", str(apk))
          signers = re.findall(r"^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)$", verification, re.MULTILINE)
          require(len(signers) == 1 and signers[0].lower() == certificate, "APK signing certificate mismatch")
          subprocess.run([str(tools / "zipalign"), "-c", "-P", "16", "4", str(apk)], check=True)
          subprocess.run(["apksigcopier", "compare", str(apk), "--unsigned", "incoming/unsigned.apk"], check=True,
                         env={**os.environ, "PATH": str(tools) + os.pathsep + os.environ["PATH"]})
          badging = run(str(tools / "aapt2"), "dump", "badging", str(apk))
          package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging, re.MULTILINE)
          require(package and package.groups() == ("com.fpink.capture", code, version), "Signed APK identity mismatch")
          require(not re.search(r"^application-debuggable(?:\s|$)", badging, re.MULTILINE), "Debuggable APK")
          manifest = {**expected, "apk": apk.name, "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
                      "signingCertificateSha256": certificate}
          (output / "release-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          shutil.copyfile("incoming/LICENSE", output / "LICENSE")
          files = (apk, output / "release-manifest.json", output / "LICENSE")
          (output / "SHA256SUMS").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name + "\n" for p in files))
          PY

      - name: Create and publish release without replacing existing versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tempfile

          def gh(*args):
              return subprocess.check_output(["gh", *args], text=True)

          def pages(endpoint):
              return [item for page in json.loads(gh("api", "--paginate", "--slurp", endpoint)) for item in page]

          repo, tag = os.environ["GITHUB_REPOSITORY"], os.environ["TAG"]
          version, sha = os.environ["VERSION_NAME"], os.environ["GITHUB_SHA"]
          if os.environ["PRERELEASE"] not in ("true", "false"):
              raise RuntimeError("Invalid release type")
          prerelease = os.environ["PRERELEASE"] == "true"
          if prerelease != ("-" in version):
              raise RuntimeError("Release type does not match version suffix")
          if any(t["name"] == tag for t in pages(f"repos/{repo}/tags?per_page=100")):
              raise RuntimeError("Tag already exists; inspect the previous run. Never overwrite a release.")
          if any(r["tag_name"] == tag for r in pages(f"repos/{repo}/releases?per_page=100")):
              raise RuntimeError("Release or draft already exists; inspect it before recovery.")
          assets = pathlib.Path("release-assets")
          manifest = json.loads((assets / "release-manifest.json").read_text())
          paths = [assets / manifest["apk"], assets / "SHA256SUMS", assets / "release-manifest.json", assets / "LICENSE"]
          notes = pathlib.Path("release-notes.txt")
          notes.write_text(
              ("Pre-release: not production-ready.\n\n" if prerelease else "") +
              f"Signed APK for Android 8.0+. Version code: {manifest['versionCode']}.\n\n"
              "Offline PaddleOCR requires ARM64. Physical ARM64/16 KB-device qualification and representative "
              "handwriting-quality testing remain separate from CI; see the recognition documentation.\n\n"
              f"License: GPL-3.0-only for FPInk code; third-party components retain their licenses. "
              f"[Corresponding source](https://github.com/{repo}/archive/refs/tags/{tag}.tar.gz) "
              f"at commit `{sha}`. This APK is a reproducible build: `scripts/fdroid-rb-docker.sh` at the tag "
              f"rebuilds it byte for byte apart from the signature; "
              f"[build instructions](https://github.com/{repo}/blob/{tag}/docs/RELEASING.md).\n\n"
              f"Signing certificate SHA-256: `{manifest['signingCertificateSha256']}`.\n"
          )
          # Creating a ref is atomic: a concurrent creator fails rather than moving it.
          gh("api", "--method", "POST", f"repos/{repo}/git/refs", "-f", f"ref=refs/tags/{tag}", "-f", f"sha={sha}")
          args = ["release", "create", tag, "--repo", repo, "--verify-tag", "--draft",
                  "--title", f"FPInk {version}", "--notes-file", str(notes), "--generate-notes"]
          if prerelease:
              args += ["--prerelease", "--latest=false"]
          if os.environ["PREVIOUS_TAG"]:
              args += ["--notes-start-tag", os.environ["PREVIOUS_TAG"]]
          gh(*args, *(str(p) for p in paths))
          release = json.loads(gh("release", "view", tag, "--repo", repo, "--json", "isDraft,isPrerelease,assets"))
          if not release["isDraft"] or release["isPrerelease"] is not prerelease or {a["name"] for a in release["assets"]} != {p.name for p in paths}:
              raise RuntimeError("Draft type or asset set mismatch; leaving it unpublished for inspection.")
          with tempfile.TemporaryDirectory(prefix="fpink-release-check-") as temp:
              gh("release", "download", tag, "--repo", repo, "--dir", temp)
              for path in paths:
                  if hashlib.sha256(path.read_bytes()).digest() != hashlib.sha256((pathlib.Path(temp) / path.name).read_bytes()).digest():
                      raise RuntimeError("Uploaded asset checksum mismatch; draft remains unpublished.")
          gh("release", "edit", tag, "--repo", repo, "--draft=false",
             f"--prerelease={str(prerelease).lower()}", f"--latest={str(not prerelease).lower()}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"\nPublished [FPInk {version}](https://github.com/{repo}/releases/tag/{tag}).\n")
          PY

  # While the fdroiddata MR (fdroid/fdroiddata!50122, from MaxDac/fdroiddata@com.fpink.capture)
  # is unmerged, checkupdates does not run for FPInk, so point the MR at the tag this run
  # just published. Needs the FDROIDDATA_GITLAB_TOKEN secret: a project access token on the
  # fork only, write_repository scope. Without it the job only warns. Delete this job once
  # the MR is merged. FDROIDDATA_FORK / FDROID_MR_BRANCH variables override the defaults.
  fdroid-mr:
    if: ${{ inputs.publish }}
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ needs.build.outputs.tag }}
      FORK: ${{ vars.FDROIDDATA_FORK || 'MaxDac/fdroiddata' }}
      BRANCH: ${{ vars.FDROID_MR_BRANCH || 'com.fpink.capture' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Push the published release to the fdroiddata MR branch
        env:
          GITLAB_TOKEN: ${{ secrets.FDROIDDATA_GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::warning::FDROIDDATA_GITLAB_TOKEN is not set; update the fdroiddata MR to $TAG manually (docs/FDROID.md)."
            echo "fdroiddata MR not updated: set FDROIDDATA_GITLAB_TOKEN or run \`scripts/fdroid_mr_bump.py --tag $TAG\` by hand." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The token never lands in a URL or .git/config.
          git config --global credential.helper \
            '!f() { test "$1" = get && echo username=oauth2 && echo "password=$GITLAB_TOKEN"; }; f'
          git clone --quiet --single-branch --branch "$BRANCH" "https://gitlab.com/$FORK.git" "$RUNNER_TEMP/fdroiddata"
          recipe="$RUNNER_TEMP/fdroiddata/metadata/com.fpink.capture.yml"
          note=$(python3 scripts/fdroid_mr_bump.py --tag "$TAG" --commit-style sha --metadata "$recipe" | grep '^MR note:')
          cd "$RUNNER_TEMP/fdroiddata"
          if git diff --quiet; then
            echo "The MR branch already targets $TAG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -am "FPInk: update to $TAG"
          git push --quiet origin "HEAD:$BRANCH"
          {
            echo "Pushed $TAG to [$FORK@$BRANCH](https://gitlab.com/$FORK/-/tree/$BRANCH); its CI runs lint and build."
            echo
            echo "Comment on the fdroiddata MR with: \`${note#MR note: }\`"
          } >> "$GITHUB_STEP_SUMMARY"
