name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and JVM unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up release tooling Python
        run: |
          python3 -m venv "$RUNNER_TEMP/tooling"
          "$RUNNER_TEMP/tooling/bin/pip" install --quiet --only-binary :all: PyYAML==6.0.3
          echo "$RUNNER_TEMP/tooling/bin" >> "$GITHUB_PATH"

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Check the declared release and its changelog
        run: python3 scripts/release_version.py --check-version-properties

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch') }}

      - name: Build, run JVM unit tests, and compile instrumentation APKs
        run: >-
          ./gradlew --continue --console=plain --stacktrace
          :app:assembleFossDebug :app:testFossDebugUnitTest :core:ai:test :core:model:test :core:storage:test
          :recognition:runtime:test :recognition:models:test :recognition:strategies:test
          :app:assembleFossDebugAndroidTest :recognition:strategies:assembleDebugAndroidTest
          :app:verifyFossDebugRecognitionPackage :app:verifyFossDebugOfflineManifest

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/**/TEST-*.xml
            **/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 14
