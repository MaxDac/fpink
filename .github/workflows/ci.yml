name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and JVM unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Validate OCR reproducibility policy
        run: >-
          python3 recognition/paddle/scripts/verify-reproducibility.py
          --manifest recognition/paddle/reproducibility.lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 ndk;28.2.13676358 cmake;3.22.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch') }}

      - name: Build, run JVM unit tests, and compile instrumentation APKs
        run: >-
          ./gradlew --continue --console=plain --stacktrace
          :app:assembleFossDebug :app:testFossDebugUnitTest :core:ai:test :core:model:test :core:storage:test :recognition:paddle:test
          :app:assembleFossDebugAndroidTest :recognition:paddle:assembleDebugAndroidTest
          :app:verifyFossDebugRecognitionPackage :app:verifyFossDebugOfflineManifest

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/**/TEST-*.xml
            **/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 14

  native-unit-tests:
    name: Native C++ unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compile and run native unit tests
        shell: pwsh
        run: ./recognition/paddle/scripts/test-geometry.ps1 -Cxx g++

      - name: Verify duplicate compiler PATH resolution
        shell: pwsh
        run: |
          $compiler = (Get-Command -Name g++ -CommandType Application -TotalCount 1 -ErrorAction Stop).Source
          $fixtureDirectory = Join-Path $env:RUNNER_TEMP 'fpink-duplicate-compiler'
          New-Item -ItemType Directory -Path $fixtureDirectory | Out-Null
          $compilerLink = Join-Path $fixtureDirectory 'g++'
          New-Item -ItemType SymbolicLink -Path $compilerLink -Target $compiler | Out-Null
          $originalPath = $env:PATH
          try {
              $env:PATH = $fixtureDirectory + [IO.Path]::PathSeparator + $originalPath
              if (@(Get-Command -Name g++ -CommandType Application -ErrorAction Stop).Count -lt 2) {
                  throw 'Duplicate-PATH regression requires multiple compiler matches'
              }
              ./recognition/paddle/scripts/test-geometry.ps1 -Cxx g++
          } finally {
              $env:PATH = $originalPath
              Remove-Item -LiteralPath $compilerLink
              Remove-Item -LiteralPath $fixtureDirectory
          }
